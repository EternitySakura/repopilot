name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.18"
      - run: uv python install
      - run: uv sync --locked
      - run: uv run --no-sync ruff check src scripts tests
      - run: uv run --no-sync python -c "from pathlib import Path; Path('artifacts/test-work').mkdir(parents=True, exist_ok=True)"
      - run: uv run --no-sync pytest tests/unit --basetemp artifacts/test-work/ci-unit --junitxml artifacts/validation/ci/unit.junit.xml
      - run: uv run --no-sync repopilot --fake-demo
