[project]
name = "repopilot"
version = "0.2.0rc2"
description = "Repository coding agent with independently verified patch candidates"
readme = "README.md"
authors = [
    { name = "EternitySakura", email = "96830806+EternitySakura@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.16,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0,<3",
]

[project.scripts]
repopilot = "repopilot.cli:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures", ".venv"]
